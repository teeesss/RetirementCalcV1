name: CI - Test & Lint
on:
  push:
    branches: [RetirementCalcV1, main]
  pull_request:
    branches: [RetirementCalcV1, main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          CI: true

      - name: Run linter
        run: npm run lint
        continue-on-error: true # Non-blocking: pre-commit catches most issues

      - name: Run ALL tests
        run: npm test -- --run
        env:
          CI: true

      # Note: Financial invariants and golden master are included in the full test run above.
      # These are kept as explicit steps for visibility in the Actions UI.
      - name: Verify financial invariant tests passed
        run: echo "✅ Financial invariants are part of the full test suite above"

      - name: Verify golden master tests passed
        run: echo "✅ Golden master tests are part of the full test suite above"

      - name: Generate test report
        if: always()
        run: |
          mkdir -p artifacts
          npm test -- --run --reporter=json --outputFile=artifacts/test-report.json || true

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-node-${{ matrix.node-version }}
          path: |
            artifacts/test-report.json
            artifacts/anomalies.json
          retention-days: 30

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test -- --coverage --run
        env:
          CI: true

      - name: Upload coverage to Codecov (optional)
        uses: codecov/codecov-action@v3
        if: false # Enable when Codecov is configured
        with:
          file: ./coverage/coverage-final.json
          fail_ci_if_error: false
